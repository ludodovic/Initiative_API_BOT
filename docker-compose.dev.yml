name: initiative-local

services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: initiative_dev
    volumes:
      - initiative_dev_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python -m app.main
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
    volumes:
      - .:/app
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  initiative_dev_mongo_data:

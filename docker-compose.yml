name: initiative-api-prod

services:
  api:
    image: initiative-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - initiative_uploads:/app/uploads

volumes:
  initiative_uploads:
